name: Release

# Publica instaladores para Linux (.AppImage/.deb/.rpm), Windows (NSIS .exe y .msi)
# y macOS (.dmg universal) en un borrador de GitHub Release al crear un tag v*.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            args: ""
          - platform: windows-latest
            args: ""
          - platform: macos-latest
            args: "--target universal-apple-darwin"
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Dependencias de sistema (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libdbus-1-dev

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ runner.os == 'macOS' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: swatinem/rust-cache@v2

      - run: npm ci

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Opcionales: se incrustan en el binario en tiempo de compilación.
          BC_GOOGLE_CLIENT_ID: ${{ vars.BC_GOOGLE_CLIENT_ID }}
          BC_GOOGLE_CLIENT_SECRET: ${{ secrets.BC_GOOGLE_CLIENT_SECRET }}
          BC_STATS_API_URL: ${{ vars.BC_STATS_API_URL }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "BetterCampus ${{ github.ref_name }}"
          releaseBody: "Descarga el instalador para tu sistema en los archivos de abajo."
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
