name: CI

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    name: Núcleo Rust (bc-core)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy -p bc-core --all-targets -- -D warnings
      - run: cargo test -p bc-core
      # Tauri runs a synchronous command on the UI thread and the window freezes until it returns.
      - name: Comandos Tauri fuera del hilo principal
        run: |
          if grep -rn -A1 --include='*.rs' '#\[tauri::command\]' src-tauri/src | grep -E -- '-[0-9]+-\s*(pub )?fn '; then
            echo "Synchronous Tauri commands found: use 'async fn' or #[tauri::command(async)]."
            exit 1
          fi

  frontend:
    name: Frontend
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npx vite build

  app:
    name: App Tauri (${{ matrix.platform }})
    needs: [core, frontend]
    strategy:
      fail-fast: false
      matrix:
        platform: [ubuntu-22.04, windows-latest]
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
      - name: Dependencias de sistema (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libdbus-1-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx vite build
      - run: cargo clippy -p bettercampus -- -D warnings
