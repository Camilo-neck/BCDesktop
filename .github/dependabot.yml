version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: monthly
    groups:
      rust:
        patterns: ["*"]
    open-pull-requests-limit: 3
    # Major versions change APIs (React Router, Vite, Tauri 3…): update them by hand.
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    groups:
      npm:
        patterns: ["*"]
    open-pull-requests-limit: 3
    # Major versions change APIs (React Router, Vite, Tauri 3…): update them by hand.
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
