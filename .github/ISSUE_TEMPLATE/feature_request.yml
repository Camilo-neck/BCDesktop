name: Proponer una función
description: Una idea para mejorar BetterCampus.
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: ¿Qué problema resuelve?
      description: Cuéntanos la situación, no solo la solución. Por ejemplo, "cada semestre tengo que…".
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Propuesta
      description: Cómo te imaginas que funcione.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternativas que consideraste
  - type: checkboxes
    id: help
    attributes:
      label: Colaboración
      options:
        - label: Me gustaría implementarla yo
